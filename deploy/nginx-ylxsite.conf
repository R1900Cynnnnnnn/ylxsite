server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name r1900ylx.xyz www.r1900ylx.xyz _;

    root /var/www/ylxsite;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name r1900ylx.xyz www.r1900ylx.xyz _;

    ssl_certificate     /etc/nginx/ssl/ylxsite.crt;
    ssl_certificate_key /etc/nginx/ssl/ylxsite.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/ylxsite;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
