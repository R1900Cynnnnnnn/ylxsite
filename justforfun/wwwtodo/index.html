<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WWWtodo — What · How · When to do · 番茄钟 + 每日计划 + 个人日记">
  <title>WWWtodo — What · How · When to do</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/diary.css">
</head>
<body>
  <div class="app-shell">
    <!-- 顶部品牌栏 -->
    <header class="brand-bar">
      <a class="back-home" href="../" title="返回 Just For Fun">← Just For Fun</a>
      <div class="brand">
        <div class="brand-logo">WWWtodo</div>
        <div class="brand-sub">What · How · When to do</div>
      </div>
      <!-- 顶部导航：三个视图 -->
      <nav class="nav" id="nav">
        <button type="button" class="nav-item active" data-view="timer">专注</button>
        <button type="button" class="nav-item" data-view="history">记录</button>
        <button type="button" class="nav-item" data-view="diary">日记</button>
      </nav>
    </header>

    <!-- 视图挂载容器：各模块 JS 渲染到对应 section -->
    <main class="main">
      <section id="view-timer" class="view"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-diary" class="view hidden"></section>
    </main>
  </div>

  <!-- 全局弹窗容器 / toast 容器 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/history.js"></script>
  <script src="js/diary.js"></script>
</body>
</html>
